<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="solarBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="solarLid" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="solarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <circle cx="200" cy="150" r="130" fill="#e2e8f0" opacity="0.4"/>

  <g transform="translate(70, 35)" filter="url(#solarShadow)">
    <!-- 6 Float Indicators -->
    <g stroke="#94a3b8" stroke-width="1.5">
      <rect x="42" y="2" width="12" height="26" rx="2" fill="#ffffff"/>
      <rect x="45" y="6" width="6" height="12" fill="#0284c7"/>
      <rect x="77" y="2" width="12" height="26" rx="2" fill="#ffffff"/>
      <rect x="80" y="6" width="6" height="12" fill="#0284c7"/>
      <rect x="112" y="2" width="12" height="26" rx="2" fill="#ffffff"/>
      <rect x="115" y="6" width="6" height="12" fill="#0284c7"/>
      <rect x="147" y="2" width="12" height="26" rx="2" fill="#ffffff"/>
      <rect x="150" y="6" width="6" height="12" fill="#0284c7"/>
      <rect x="182" y="2" width="12" height="26" rx="2" fill="#ffffff"/>
      <rect x="185" y="6" width="6" height="12" fill="#0284c7"/>
      <rect x="217" y="2" width="12" height="26" rx="2" fill="#ffffff"/>
      <rect x="220" y="6" width="6" height="12" fill="#0284c7"/>
    </g>

    <!-- Terminals -->
    <rect x="18" y="14" width="16" height="18" rx="2" fill="#ef4444"/>
    <text x="26" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <rect x="238" y="14" width="16" height="18" rx="2" fill="#334155"/>
    <text x="246" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

    <!-- Top Blue Lid -->
    <rect x="10" y="28" width="250" height="36" rx="5" fill="url(#solarLid)"/>

    <!-- Handles -->
    <path d="M 12 50 L 0 65 L 12 80" fill="none" stroke="#0284c7" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 258 50 L 270 65 L 258 80" fill="none" stroke="#0284c7" stroke-width="4" stroke-linejoin="round"/>

    <!-- Tall Main Body -->
    <rect x="12" y="60" width="246" height="165" rx="3" fill="url(#solarBody)"/>

    <!-- Spine lines -->
    <g stroke="#334155" stroke-width="1.5">
      <line x1="48" y1="75" x2="48" y2="215"/>
      <line x1="83" y1="75" x2="83" y2="215"/>
      <line x1="118" y1="75" x2="118" y2="215"/>
      <line x1="153" y1="75" x2="153" y2="215"/>
      <line x1="188" y1="75" x2="188" y2="215"/>
      <line x1="223" y1="75" x2="223" y2="215"/>
    </g>

    <!-- Brand Label with Solar Theme -->
    <rect x="35" y="85" width="200" height="98" rx="6" fill="#0284c7"/>
    <rect x="38" y="88" width="194" height="92" rx="4" fill="#0f172a"/>

    <text x="135" y="112" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">SOLAR TUBULAR</text>
    <text x="135" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">C10 RATED &#8226; 150Ah / 12V</text>
    <text x="135" y="148" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#facc15" text-anchor="middle">1500+ CYCLES @ 80% DOD</text>
    <text x="135" y="166" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#94a3b8" text-anchor="middle">HIGH CHARGE EFFICIENCY &#8226; OFF-GRID</text>

    <!-- Bottom Rim -->
    <rect x="8" y="222" width="254" height="12" rx="3" fill="#090d16"/>
  </g>
</svg>

