<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="upsBatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="upsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <circle cx="200" cy="150" r="120" fill="#e2e8f0" opacity="0.4"/>

  <g transform="translate(85, 45)" filter="url(#upsShadow)">
    <!-- Faston Spade Terminals -->
    <!-- Positive Terminal (Red tab) -->
    <rect x="35" y="12" width="16" height="22" rx="2" fill="#ef4444"/>
    <rect x="39" y="4" width="8" height="10" rx="1" fill="#cbd5e1"/>
    <text x="43" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <!-- Negative Terminal (Black/Slate tab) -->
    <rect x="179" y="12" width="16" height="22" rx="2" fill="#334155"/>
    <rect x="183" y="4" width="8" height="10" rx="1" fill="#cbd5e1"/>
    <text x="187" y="27" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

    <!-- Top Sealed Lid -->
    <rect x="20" y="32" width="190" height="20" rx="3" fill="#0f172a"/>
    <rect x="25" y="36" width="180" height="6" rx="2" fill="#059669"/>

    <!-- Main Battery Body -->
    <rect x="20" y="50" width="190" height="155" rx="4" fill="url(#upsBatBg)"/>

    <!-- Spec Label -->
    <rect x="32" y="65" width="166" height="105" rx="5" fill="#ffffff"/>
    <rect x="34" y="67" width="162" height="101" rx="4" fill="#0f172a"/>

    <text x="115" y="90" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">POWERSAFE UPS</text>
    <text x="115" y="106" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8" text-anchor="middle">SEALED RECHARGEABLE BATTERY</text>
    <text x="115" y="128" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#34d399" text-anchor="middle">12V 12Ah / 20HR</text>
    <text x="115" y="146" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#cbd5e1" text-anchor="middle">CONSTANT VOLTAGE CHARGE</text>
    <text x="115" y="158" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#94a3b8" text-anchor="middle">STANDBY: 13.5 - 13.8V &#8226; CYCLE: 14.4 - 15.0V</text>

    <!-- Base Ridge -->
    <rect x="18" y="203" width="194" height="10" rx="2" fill="#090d16"/>
  </g>
</svg>

