<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="invCase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="invFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ledScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="invShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <circle cx="200" cy="150" r="130" fill="#e2e8f0" opacity="0.4"/>

  <g transform="translate(45, 55)" filter="url(#invShadow)">
    <!-- Chassis Body -->
    <rect x="10" y="15" width="290" height="165" rx="10" fill="url(#invCase)"/>
    <rect x="14" y="19" width="282" height="157" rx="8" fill="url(#invFront)"/>

    <!-- Top Metallic Edge / Bezel -->
    <rect x="25" y="28" width="260" height="4" rx="2" fill="#059669"/>

    <!-- Smart Digital LED Display Screen -->
    <rect x="35" y="42" width="165" height="75" rx="6" fill="url(#ledScreen)" stroke="#059669" stroke-width="1.5"/>

    <!-- Digital Readout inside Screen -->
    <text x="50" y="66" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#34d399">8:45 <tspan font-size="11">HRS</tspan></text>
    <text x="50" y="82" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#a7f3d0">BACKUP TIME REMAINING</text>
    <text x="50" y="102" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#6ee7b7">BATTERY: 92% | LOAD: 45%</text>

    <!-- Sine Wave Graph Symbol on Display -->
    <path d="M 150 56 Q 160 46 170 56 T 190 56" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Controls Column -->
    <!-- Power Button -->
    <circle cx="245" cy="65" r="18" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <circle cx="245" cy="65" r="14" fill="#059669"/>
    <path d="M 245 57 L 245 64 M 240 60 A 7 7 0 1 0 250 60" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Status LEDs (Mains, Charging, Inverter, Fault) -->
    <g transform="translate(215, 96)">
      <circle cx="10" cy="5" r="3.5" fill="#10b981"/>
      <text x="18" y="8" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#94a3b8">MAINS</text>

      <circle cx="10" cy="16" r="3.5" fill="#38bdf8"/>
      <text x="18" y="19" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#94a3b8">UPS MODE</text>
    </g>

    <!-- Cooling Air Slits on Lower Section -->
    <g stroke="#334155" stroke-width="3" stroke-linecap="round">
      <line x1="40" y1="135" x2="270" y2="135"/>
      <line x1="40" y1="143" x2="270" y2="143"/>
      <line x1="40" y1="151" x2="270" y2="151"/>
    </g>

    <!-- Inverter Brand Sub-text -->
    <text x="40" y="170" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="0.5">PURE SINE WAVE HOME UPS</text>
    <text x="270" y="170" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#10b981" text-anchor="end">1100 VA / 12V</text>

    <!-- Support Feet -->
    <rect x="35" y="178" width="22" height="6" rx="2" fill="#0f172a"/>
    <rect x="253" y="178" width="22" height="6" rx="2" fill="#0f172a"/>
  </g>
</svg>

