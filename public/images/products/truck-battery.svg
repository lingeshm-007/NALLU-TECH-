<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="truckBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="truckShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#f8fafc"/>
  <circle cx="200" cy="150" r="130" fill="#e2e8f0" opacity="0.4"/>

  <g transform="translate(35, 45)" filter="url(#truckShadow)">
    <!-- Heavy Duty Handles on Both Ends -->
    <path d="M 40 40 L 40 10 L 80 10 L 80 40" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 250 40 L 250 10 L 290 10 L 290 40" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Terminals with heavy brass posts -->
    <rect x="95" y="16" width="26" height="24" rx="4" fill="#ef4444"/>
    <rect x="101" y="8" width="14" height="10" rx="2" fill="#cbd5e1"/>
    <text x="108" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <rect x="209" y="16" width="26" height="24" rx="4" fill="#334155"/>
    <rect x="215" y="8" width="14" height="10" rx="2" fill="#cbd5e1"/>
    <text x="222" y="32" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

    <!-- Top Reinforced Cover -->
    <rect x="20" y="38" width="290" height="38" rx="6" fill="#0f172a"/>
    <!-- Vent Caps (6 heavy threaded caps) -->
    <circle cx="65" cy="57" r="7" fill="#f59e0b"/>
    <circle cx="105" cy="57" r="7" fill="#f59e0b"/>
    <circle cx="145" cy="57" r="7" fill="#f59e0b"/>
    <circle cx="185" cy="57" r="7" fill="#f59e0b"/>
    <circle cx="225" cy="57" r="7" fill="#f59e0b"/>
    <circle cx="265" cy="57" r="7" fill="#f59e0b"/>

    <!-- Rugged Heavy Duty Body -->
    <rect x="20" y="74" width="290" height="135" rx="4" fill="url(#truckBody)"/>

    <!-- Shock & Vibration Resistant Structural Ribs -->
    <g stroke="#334155" stroke-width="2.5">
      <line x1="35" y1="85" x2="35" y2="198"/>
      <line x1="85" y1="85" x2="85" y2="198"/>
      <line x1="245" y1="85" x2="245" y2="198"/>
      <line x1="295" y1="85" x2="295" y2="198"/>
    </g>

    <!-- Front Badge -->
    <rect x="95" y="88" width="140" height="92" rx="6" fill="#f59e0b"/>
    <rect x="98" y="91" width="134" height="86" rx="4" fill="#0f172a"/>

    <text x="165" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">HEAVY VEHICLE</text>
    <text x="165" y="132" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#f59e0b" text-anchor="middle">100Ah &#8226; 12V</text>
    <text x="165" y="148" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">TRUCK &amp; TRACTOR</text>
    <text x="165" y="163" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#94a3b8" text-anchor="middle">EXTREME VIBRATION PROOF</text>

    <!-- Base Bumper -->
    <rect x="15" y="206" width="300" height="12" rx="3" fill="#020617"/>
  </g>
</svg>

