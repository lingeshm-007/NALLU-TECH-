<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="carBatBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="carBatTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="termPos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="termNeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Studio Gradient -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <circle cx="200" cy="150" r="130" fill="#e2e8f0" opacity="0.4"/>

  <!-- Battery Group -->
  <g transform="translate(40, 45)" filter="url(#shadow)">
    <!-- Terminals -->
    <!-- Positive Terminal (Red) -->
    <rect x="45" y="15" width="28" height="25" rx="4" fill="url(#termPos)"/>
    <rect x="52" y="5" width="14" height="12" rx="2" fill="#cbd5e1"/>
    <text x="59" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">+</text>

    <!-- Negative Terminal (Black/Slate) -->
    <rect x="247" y="15" width="28" height="25" rx="4" fill="url(#termNeg)"/>
    <rect x="254" y="5" width="14" height="12" rx="2" fill="#cbd5e1"/>
    <text x="261" y="31" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">-</text>

    <!-- Handle -->
    <path d="M 70 30 Q 160 -8 250 30" fill="none" stroke="#047857" stroke-width="8" stroke-linecap="round"/>

    <!-- Top Lid -->
    <rect x="20" y="35" width="280" height="42" rx="6" fill="url(#carBatTop)"/>
    <!-- Vent Caps -->
    <circle cx="95" cy="56" r="8" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <circle cx="125" cy="56" r="8" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <circle cx="155" cy="56" r="8" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <circle cx="185" cy="56" r="8" fill="#065f46" stroke="#10b981" stroke-width="2"/>
    <circle cx="215" cy="56" r="8" fill="#065f46" stroke="#10b981" stroke-width="2"/>

    <!-- Magic Eye Indicator -->
    <circle cx="58" cy="56" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2"/>

    <!-- Main Battery Body -->
    <rect x="20" y="73" width="280" height="135" rx="4" fill="url(#carBatBg)"/>

    <!-- Reinforced Ribs -->
    <line x1="32" y1="85" x2="32" y2="195" stroke="#334155" stroke-width="2"/>
    <line x1="288" y1="85" x2="288" y2="195" stroke="#334155" stroke-width="2"/>

    <!-- Battery Brand Label -->
    <rect x="45" y="92" width="230" height="80" rx="6" fill="#059669" opacity="0.95"/>
    <rect x="48" y="95" width="224" height="74" rx="4" fill="#0f172a"/>

    <text x="160" y="122" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">AUTOMOTIVE POWER</text>
    <text x="160" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">12V &#8226; HIGH CRANKING AMPS</text>
    <text x="160" y="157" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#94a3b8" text-anchor="middle">ZERO MAINTENANCE &#8226; SILVER ALLOY</text>

    <!-- Bottom Base Rim -->
    <rect x="15" y="204" width="290" height="12" rx="3" fill="#0f172a"/>
  </g>
</svg>

